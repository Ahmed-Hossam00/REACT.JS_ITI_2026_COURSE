<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
    <style>
      .post {
        max-width: 640px;
        margin: 24px auto;
        padding: 24px;
        border: 1px solid #dbe3ef;
        border-left: black 2px solid;
        background: #fff;
        color: #25324a;
      }

      .post h2 {
        margin: 0 0 12px;
        font-size: 1.4rem;
      }

      .post p {
        margin: 0 0 18px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .post span {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 999px;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <div id="postsContainer"></div>
    <script src="js/sessionActivity.js"></script>
  </body>
</html>
